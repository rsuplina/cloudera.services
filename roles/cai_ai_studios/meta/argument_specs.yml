argument_specs:
  main:
    short_description: "Install AI Studio"
    description:
      - Launch and configure Cloudera AI Studio.
      - Flexible to deploy any AI Studio with pre-defined configurations for Agent Studio, Fine Tuning Studio, Synthetic Data Studio and RAG Studio
    author:
      - "Jim Enright <jenright@cloudera.com>"
    options:
      cai_ai_studio_async_setup:
        description:
          - Whether to wait for the AI Studio setup to complete or not.
          - If set to true, the task will initiate the setup and return immediately.
          - If set to false, the task will poll until the setup is complete.
        type: bool
        default: false
      cai_workspace_api:
        description:
          - Cloudera AI Workbench API endpoint
        type: str
        required: true
      cai_workbench_api_key:
        description:
          - Cloudera AI Workbench API v2 key
        type: str
        required: true
      cai_project:
        description:
          - The name of a pre-existing Cloudera AI project name.
        type: str
        required: true
      cai_user:
        description:
          - Cloudera AI Username.
          - Usually your workload username.
        type: str
        required: true
      cai_runtime_image_name:
        description:
          - Runtime Image to use for the AI Studio
        type: str
        required: true
      cai_environment_variables:
        description:
          - Environment Variables to set for the AI studio
        type: dict
        default: {}
      cai_runtime_addons:
        description:
          - List of Cloudera AI runtime to include in the AI Studio configuration.
        type: list
        elements: str
        default: []
      cai_task_level_runtimes:
        description:
          - List of Cloudera AI adds ons to include in the AI Studio task configurations.
        type: list
        elements: str
        default: []
      ai_studio:
        description:
          - String to select pre-defined AI Studio configurations
          - Setting O(cai_ai_studio_details) variable ignores this variable
        type: str
        default: "agent_studio"
        choices:
          - agent_studio
          - fine_tuning_studio
          - synthetic_data_studio
          - rag_studio
      cai_ai_studio_details:
        description:
          - Details of AI Studio configuration.
          - Use if not using a pre-defined AI Studio, as defined in `vars/main.yml`.
        type: dict
        required: false
        options:
          slug:
            type: str
            description: Slug for deployed AI Studio application
          git_url:
            type: str
            description: URL to the Git repository for the AI Studio
          git_ref:
            type: str
            description: Branch of Git repository
          name:
            type: str
            description: Display name of the AI Studio
          run_import_tasks:
            type: bool
            description: Flag to specify if import tasks should be run during AI studio configuration
