argument_specs:
  main:
    short_description: "Register LLM Model"
    description:
      - Configure a specified list of LLM models with Cloudera AI Studios.
    author:
      - "Jim Enright <jenright@cloudera.com>"
    options:
      cai_workspace_api:
        description:
          - Cloudera AI Workbench API endpoint
        type: str
        required: true
      cai_ai_studio_amp_deployment:
        description:
          - Whether the AI Studio is deployed as an AMP deployment.
          - If true, the role will verify the AI Studio AMP deployment exists
        type: bool
        required: false
        default: true
      cai_workbench_api_key:
        description:
          - Cloudera AI Workbench API v2 key
        type: str
        required: true
      cai_project:
        description:
          - The name of a pre-existing Cloudera AI project name.
        type: str
        required: true
      cai_endpoint_tls:
        description:
          - Whether to verify TLS certificates for API endpoints
          - Set to false to skip TLS certificate verification
        type: bool
        required: false
        default: true
      cai_user:
        description:
          - Cloudera AI Username.
          - Usually your workload username.
        type: str
        required: true
      ai_studio:
        description:
          - String to select pre-defined AI Studio configurations
          - Setting O(cai_ai_studio_override) variable ignores this variable
        type: str
        default: "agent_studio"
        choices:
          - agent_studio
          - fine_tuning_studio
          - synthetic_data_studio
          - rag_studio
      cai_ai_studio_override:
        description:
          - Override of the pre-defined AI Studio configurations.
          - Setting this variable ignores the variable for O(ai_studio).
        type: dict
        required: false
        options:
          slug:
            type: str
            description: Slug for deployed AI Studio application
          application_name:
            type: str
            description: Display name of the AI Studio
      llm_model_details:
        description:
          - List of LLM models to register
        type: list
        elements: dict
        required: false
        default: []
        options:
          model_name:
            type: str
            description: Name of the LLM model to register
          model_type:
            type: str
            description: Type of the LLM model (e.g., OPENAI)
          provider_model:
            type: str
            description: Provider-specific model identifier (e.g., gpt-4o-mini)
          api_base:
            type: str
            description: API base URL for the model (optional)
          api_key:
            type: str
            description: API key for accessing the model
          default:
            type: bool
            default: false
            description: Set this model as the default for the AI Studio
