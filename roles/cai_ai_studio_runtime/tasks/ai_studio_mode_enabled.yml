- name: Check for existing AI Studios
  ansible.builtin.uri:
    url: "{{ cai_workspace_api }}/api/v1/projects/{{ cai_user }}/{{ cai_project }}/composable-accelerators"
    method: GET
    user: "{{ cai_workbench_api_key }}"
    password: ''
    force_basic_auth: yes
    validate_certs: "{{ cai_endpoint_tls }}"
  register: __studio_info

- name: Extract existing AI Studio details
  ansible.builtin.set_fact:
    __existing_studio: "{{ (__studio_info.json | selectattr('slug', 'match', cai_agent_studio_slug) | first) | default([]) }}"

- name: Launch the AI Studio if required
  when: (__existing_studio | length == 0 or
        __existing_studio.status not in ['configuration', 'running', 'success'])
  ansible.builtin.uri:
    url: "{{ cai_workspace_api }}/api/v1/projects/{{ cai_user }}/{{ cai_project }}/composable-accelerators"
    method: POST
    status_code:
      - 200
      - 201
    user: "{{ cai_workbench_api_key }}"
    password: ''
    force_basic_auth: yes
    body_format: json
    body:
      name: "{{ cai_agent_studio_app_name }}"
      slug: "{{ cai_agent_studio_slug }}"
      gitUrl: "{{ cai_agent_studio_git_url }}"
      gitRef: "{{ cai_agent_studio_git_ref }}"
    validate_certs: "{{ cai_endpoint_tls }}"
  register: __studio_launch

- name: Find available runtimes
  ansible.builtin.uri:
    url: "{{ cai_workspace_api }}/api/v1/runtimes/?includeAll=true"
    method: GET
    user: "{{ cai_workbench_api_key }}"
    password: ''
    force_basic_auth: yes
    validate_certs: "{{ cai_endpoint_tls }}"
  register: __runtimes_info

- name: Set the AI Studio ID
  ansible.builtin.set_fact:
    __studio_deployment_id: "{{ __studio_launch.json.id | default(__existing_studio.id) }}"
    __runtime_id: "{{ (__runtimes_info.json['runtimes'] | selectattr('fullVersion', 'eq', runtime_version)) | map(attribute='id') | first }}"
  vars:
    runtime_version: "{{ __runtimes_info.json['runtimes'] | selectattr('edition', 'eq', 'Agent Studio') | selectattr('editor', 'eq', 'PBJ Workbench') | selectattr('kernel', 'eq', 'Agent Studio') | map(attribute='fullVersion') | community.general.version_sort(reverse=True) | first }}"

- name: Configure the AI Studio
  when: (__existing_studio | length == 0 or
        __existing_studio.status not in ['running', 'success'])
  ansible.builtin.uri:
    url: "{{ cai_workspace_api }}/api/v1/projects/{{ cai_user }}/{{ cai_project }}/composable-accelerators/{{ __studio_deployment_id }}/configure"
    method: POST
    status_code:
      - 200
      - 201
    user: "{{ cai_workbench_api_key }}"
    password: ''
    force_basic_auth: yes
    body_format: json
    body: >
      {
        "engineImageRuntimeId": {{ __runtime_id | int }},
        "runImportTasks": {{ cai_agent_studio_run_import_tasks | lower }},
        "environmentVariables": {{ cai_agent_studio_environment_variables | to_json }},
        "runtimeAddons": {{ cai_agent_studio_runtime_addons }},
        "taskLevelRuntimes": {{ cai_agent_studio_task_level_runtimes }}
      }
    validate_certs: "{{ cai_endpoint_tls }}"
  register: __studio_configure

- name: Polling until AI Studio configuration has completed
  when: not cai_ai_studio_async_setup
  ansible.builtin.uri:
    url: "{{ cai_workspace_api }}/api/v1/projects/{{ cai_user }}/{{ cai_project }}/composable-accelerators/{{ __studio_deployment_id }}"
    method: GET
    user: "{{ cai_workbench_api_key }}"
    password: ''
    force_basic_auth: yes
    validate_certs: "{{ cai_endpoint_tls }}"
  register: __studio_status
  retries: 60
  delay: 30
  until: "__studio_status.json['status'] == 'success'"
