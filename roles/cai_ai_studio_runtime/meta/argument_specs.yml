argument_specs:
  main:
    short_description: "Deploy Cloudera AI Agent Studio Runtime"
    description:
      - Deploy Cloudera AI Agent Studio using runtime repository and application management.
    author:
      - "Jim Enright <jenright@cloudera.com>"
    options:
      cai_workspace_api:
        description:
          - Cloudera AI Workbench API endpoint
        type: str
        required: true
      cai_workbench_api_key:
        description:
          - Cloudera AI Workbench API v2 key
        type: str
        required: true
      cai_project:
        description:
          - The name of a pre-existing Cloudera AI project name
        type: str
        required: true
      cai_endpoint_tls:
        description:
          - Whether to verify TLS certificates for API endpoints
          - Set to false to skip TLS certificate verification
        type: bool
        required: false
        default: true
      cai_agent_studio_runtime_repo_url:
        description:
          - URL to the Agent Studio runtime repository
        type: str
        required: false
        default: "https://archive.cloudera.com/agent-studio/latest/artifacts/repo-assembly.json"
      cai_agent_studio_runtime_name:
        description:
          - Name of the Agent Studio runtime
        type: str
        required: false
        default: "Agent Studio"
      cai_ai_studio_async_setup:
        description:
          - Whether to set up AI Studio asynchronously
        type: bool
        required: false
        default: false
      cai_ai_studio_mode_enabled:
        description:
          - Whether to deploy Agent Studio using AI Studios Enabled Mode (true) or Disabled Mode (false)
          - Enabled Mode uses Composable Accelerators API
          - Disabled Mode uses Application deployment
        type: bool
        required: false
        default: true
      cai_agent_studio_app_name:
        description:
          - Name of the Agent Studio application (AI Studios Disabled Mode)
        type: str
        required: false
        default: "Agent Studio"
      cai_agent_app_cpu:
        description:
          - CPU allocation for the Agent Studio application (AI Studios Disabled Mode)
        type: int
        required: false
        default: 2
      cai_agent_app_memory:
        description:
          - Memory allocation (in GB) for the Agent Studio application (AI Studios Disabled Mode)
        type: int
        required: false
        default: 4
      cai_agent_studio_script:
        description:
          - Script path to run the Agent Studio application (AI Studios Disabled Mode)
        type: str
        required: false
        default: "/studio_app/startup_scripts/run-app.py"
      cai_agent_studio_subdomain:
        description:
          - Subdomain for the Agent Studio application (AI Studios Disabled Mode)
        type: str
        required: false
        default: "agent-studio"
      cai_agent_studio_app_auth:
        description:
          - Whether authentication is required for the Agent Studio application (AI Studios Disabled Mode)
        type: bool
        required: false
        default: true
      cai_agent_studio_environment:
        description:
          - Environment variables for the Agent Studio application (AI Studios Disabled Mode)
        type: dict
        required: false
      cai_user:
        description:
          - Cloudera AI user for the project (AI Studios Enabled Mode)
          - Required when cai_ai_studio_mode_enabled is true
        type: str
        required: false
      cai_agent_studio_slug:
        description:
          - Slug identifier for the Agent Studio composable accelerator (AI Studios Enabled Mode)
        type: str
        required: false
        default: "agent-studio"
      cai_agent_studio_git_url:
        description:
          - Git repository URL for Agent Studio Runtime Config (AI Studios Enabled Mode)
        type: str
        required: false
        default: "https://github.com/cloudera/Agent-Studio-Runtime-Config"
      cai_agent_studio_git_ref:
        description:
          - Git reference (branch, tag, or SHA) to use (AI Studios Enabled Mode)
        type: str
        required: false
        default: "main"
      cai_agent_studio_run_import_tasks:
        description:
          - Whether to run import tasks when setting up Agent Studio (AI Studios Enabled Mode)
        type: bool
        required: false
        default: true
      cai_agent_studio_environment_variables:
        description:
          - Environment variables for Agent Studio (AI Studios Enabled Mode)
        type: dict
        required: false
        default: {}
      cai_agent_studio_runtime_addons:
        description:
          - Runtime addons for Agent Studio (AI Studios Enabled Mode)
        type: list
        required: false
        default: []
      cai_agent_studio_task_level_runtimes:
        description:
          - Task-level runtimes for Agent Studio (AI Studios Enabled Mode)
        type: list
        required: false
        default: []
