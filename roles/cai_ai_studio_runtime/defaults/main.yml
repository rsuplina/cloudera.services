---

cai_workspace_api: "{{ undef(hint='Please define CAI Workbench API endpoint') }}"
cai_workbench_api_key: "{{ undef(hint='Please define CAI Workbench API key') }}"
cai_project: "{{ undef(hint='Please define CAI Project name') }}"
cai_endpoint_tls: true

cai_agent_studio_runtime_repo_url: https://archive.cloudera.com/agent-studio/latest/artifacts/repo-assembly.json
cai_agent_studio_runtime_name: "Agent Studio"

cai_ai_studio_async_setup: false

cai_ai_studio_mode_enabled: true

### AI Studios Disabled Mode Settings
cai_agent_studio_app_name: "Agent Studio"
# cai_agent_studio_environment:
cai_agent_app_cpu: 2
cai_agent_app_memory: 4
cai_agent_studio_script: /studio_app/startup_scripts/run-app.py
cai_agent_studio_subdomain: "agent-studio"
cai_agent_studio_app_auth: True

### AI Studios Enabled Mode Settings
# cai_user:
cai_agent_studio_slug: "agent-studio"
cai_agent_studio_git_url: "https://github.com/cloudera/Agent-Studio-Runtime-Config"
cai_agent_studio_git_ref: "main"
cai_agent_studio_run_import_tasks: yes
cai_agent_studio_environment_variables: {}
cai_agent_studio_runtime_addons: []
cai_agent_studio_task_level_runtimes: []
